spring:
  application:
    name: notification-service
#    version: @project.version@
  profiles:
    active: home
  webflux:
    base-path: "/home/notification"
  reactor:
    # default LIMITED restores ThreadLocals only in "tap" and "handle", so traceId would be
    # missing from the MDC of every log statement inside a reactive chain
    context-propagation: auto
  rabbitmq:
    host: rabbitmq-headless
    port: 5672
    username: notification
    password: ${rabbitmq-password:dummy}
    virtual-host: /notification
    connection-timeout: 10s
    requested-heartbeat: 10s
    listener:
      simple:
        # defaults to false; without it the trace breaks at the queue and an alert cannot be
        # followed back to the service that raised it
        observation-enabled: true

server:
  port: 6200
management:
  server:
    port: 8200
  endpoint:
    health:
      # a 404 on the readiness path crash-loops the pod, so the probe groups are pinned here
      # instead of relying on Boot detecting the Kubernetes platform — and kept in the shared
      # document, where the paths can be exercised locally on 8003 before the manifest ships
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      # default 0.1; a home system generates so little traffic that sampling everything is free,
      # and a partially sampled trace is useless when it is the only record of a request
      probability: 1.0

logbook:
  format:
    style: json
  # a call to a push service is never logged: its address is the subscription itself - anybody holding
  # it could post to that browser - and the body is ciphertext (HAS-276)
  client:
    predicate:
      exclude:
        - path: "https://*.push.apple.com/**"
        - path: "https://fcm.googleapis.com/**"
        - path: "https://*.push.services.mozilla.com/**"
        - path: "https://*.notify.windows.com/**"

logging:
  structured:
    format:
      console: logstash
  level:
    org.zalando.logbook: trace

# the household category by Web Push (HAS-276): the members at home, each of their browsers that
# subscribed in the installed application. The keys come from the manifest (the private one from the
# secret 'notification'); the service checks at the start that they are one pair
household:
  push:
    enabled: true
    # who the push services may write to about this sender - the owner's address, from the manifest
    subject: ${push-subject:}
    public-key: ${vapid-public-key:}
    private-key: ${vapid-private-key:}
    # how long a push service keeps a message for a phone that is off: an hour, like the queue
    ttl: 60
    # the push services the browsers of the household subscribe at: Apple (Safari, the iPhones), Google
    # (Chrome), Mozilla, Microsoft. A host below one of these is taken; anything else is never posted to
    allowed-hosts:
      - push.apple.com
      - fcm.googleapis.com
      - push.services.mozilla.com
      - notify.windows.com

# the services this one calls inside the cluster, over k8s DNS. A bare number of a timeout is seconds
internal:
  service:
    # who of the household is at home
    presence:
      url: http://presence-service:6200
      connect-timeout: 3s
      response-timeout: 5s
    # the push subscriptions of their browsers
    database:
      url: http://database-service:6200
      connect-timeout: 3s
      response-timeout: 5s

rabbit:
  alert:
    queue: notification.prod.alert
  info:
    queue: notification.prod.info
  household:
    queue: notification.prod.household

discord:
  bot:
    skippy:
      token: ${discord_bot_skippy_token:dummy}
      # the Discord id of the channel every notification goes to; not a secret, and no default
      # on purpose: a made-up one would start the service and fail every delivery
      alerts-channel-id: ${discord_alerts_channel_id}
      # the household channel (HAS-274), in Polish; the same reasons for no default
      household-channel-id: ${discord_household_channel_id}

---

spring:
  config:
    activate:
      on-profile: local
  rabbitmq:
    host: localhost

server:
  port: 6003
management:
  server:
    port: 8003

logbook:
  format:
    style: http

logging:
  structured:
    format:
      console: ""

rabbit:
  alert:
    queue: notification.dev.alert
  info:
    queue: notification.dev.info
  household:
    queue: notification.dev.household

# a local run posts no push unless asked to: the keys and the subject are the production ones, from
# the manifest - switch it on with PUSH_ENABLED=true and the variables of household.push
household:
  push:
    enabled: ${push-enabled:false}

---

spring:
  config:
    activate:
      on-profile: test
  autoconfigure:
    exclude: org.springframework.boot.amqp.autoconfigure.RabbitAutoConfiguration

discord:
  bot:
    skippy:
      alerts-channel-id: 1
      household-channel-id: 2

logbook:
  format:
    style: http

logging:
  structured:
    format:
      console: ""

household:
  push:
    # no push in the tests: a test that wants the transport switches it on with keys of its own
    enabled: false
